<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="brand/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>SpeedRadio · Licensing requests (admin)</title>
  </head>
  <body class="adm">
    <header class="adm-head">
      <span class="adm-logo"><img src="brand/logo-mark.png" alt="" />SpeedRadio</span>
      <span class="adm-tag">Admin · Licensing requests</span>
      <span class="adm-sp"></span>
      <button id="refresh" class="adm-btn ghost" hidden>Refresh</button>
      <button id="logout" class="adm-btn ghost" hidden>Sign out</button>
    </header>
    <main class="adm-wrap">
      <section id="login" class="adm-login">
        <h1>Licensing requests</h1>
        <p>Sign in to review licensing requests and messages.</p>
        <form id="loginForm" class="adm-form">
          <label><span>Username</span><input id="user" autocomplete="username" /></label>
          <label><span>Password</span><input id="pass" type="password" autocomplete="current-password" /></label>
          <p id="loginErr" class="adm-err" hidden></p>
          <button class="adm-btn">Sign in</button>
        </form>
        <small class="muted">Prototype login: admin / PWD123</small>
      </section>
      <section id="board" hidden>
        <div id="banner" class="adm-banner" hidden></div>
        <div class="adm-stats" id="stats"></div>
        <div class="adm-filters" id="filters"></div>
        <div id="list" class="adm-list"></div>
        <h2 class="adm-h2">Talk to us messages</h2>
        <div id="msgs" class="adm-list"></div>
      </section>
    </main>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
